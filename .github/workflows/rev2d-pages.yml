name: Rev2D Mobile Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rev2d-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build mobile editor
        run: npm run editor:build
        env:
          VITE_REV2D_STATIC: 'true'
      - name: Smoke-test mobile browser and local project persistence
        run: node scripts/check-mobile-pages.mjs
        env:
          REV2D_CAPTURE_SCREENSHOTS: '1'
      - name: Upload Rev2D original UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev2d-original-mobile-screens
          path: rev2d-screen-references/*.png
          if-no-files-found: warn
      - run: touch dist/editor/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/editor
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
